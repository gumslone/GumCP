# GumCP web-server hardening
#
# Install:  sudo cp deploy/gumcp-apache.conf /etc/apache2/conf-available/gumcp.conf
#           sudo a2enconf gumcp && sudo systemctl reload apache2
# (installer.sh does this for you.)
#
# WHY THIS EXISTS
# GumCP ships .htaccess files in the directories that must not be served, but
# Debian and Raspberry Pi OS configure Apache with "AllowOverride None" for
# /var/www, which makes .htaccess files inert — the rules are silently ignored.
# The directives below live in the server configuration instead, so they apply
# regardless of that setting.
#
# @GUMCP_DIR@ is replaced with the real install path by installer.sh. If you are
# applying this by hand, substitute your own path.

<Directory "@GUMCP_DIR@">
    # No directory listings anywhere in the panel.
    Options -Indexes

    # Let GumCP's bundled .htaccess files work too — notably the root one, which
    # passes the Authorization header through for HTTP Basic Auth.
    AllowOverride All
</Directory>

# ── Runtime data ──────────────────────────────────────────────────────────────
# buttons/       contains buttons.json, which stores each button's API hash —
#                a credential that triggers a command with no login.
# command_logs/  contains the output of executed commands, which can include
#                anything those commands printed, credentials included.
<Directory "@GUMCP_DIR@/buttons">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</Directory>

<Directory "@GUMCP_DIR@/command_logs">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</Directory>

# user_scripts/  scripts written in the Script Editor — may contain credentials
#                and must never be served or executed over HTTP.
<Directory "@GUMCP_DIR@/user_scripts">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</Directory>

# ── Third-party module code ───────────────────────────────────────────────────
# Vendored upstream files are loaded by the guarded entry point that enforces the
# GumCP login. They must never be requested directly.
<DirectoryMatch "^@GUMCP_DIR@/modules/[^/]+/vendor">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</DirectoryMatch>

# ── Configuration ─────────────────────────────────────────────────────────────
# include/config.php holds SSH_PASS and the login credentials. PHP normally
# executes it rather than serving its source, but if the PHP handler is ever
# misconfigured the file would be served as plain text — deny it outright.
<Directory "@GUMCP_DIR@/include">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</Directory>
