<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="GumCP — Raspberry Pi Web Control Panel">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5305a"/>
      <stop offset="1" stop-color="#2b3a8c"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e8a4f"/>
      <stop offset="1" stop-color="#0a6d3e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ── Emblem: shield + PCB + raspberry ── -->
  <g filter="url(#soft)">
    <!-- shield -->
    <path d="M60 38 L160 38 Q172 38 172 52 L172 120 Q172 178 116 202 Q60 178 60 120 L60 52 Q60 38 72 38 Z"
          transform="translate(-6 0)" fill="url(#shield)"/>
    <path d="M60 38 L160 38 Q172 38 172 52 L172 120 Q172 178 116 202 Q60 178 60 120 L60 52 Q60 38 72 38 Z"
          transform="translate(-6 0)" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <!-- circuit board -->
    <rect x="72" y="78" width="76" height="70" rx="8" fill="url(#board)"/>
    <!-- GPIO header -->
    <g fill="#f4c430">
      <circle cx="84" cy="90" r="3"/><circle cx="94" cy="90" r="3"/><circle cx="104" cy="90" r="3"/>
      <circle cx="114" cy="90" r="3"/><circle cx="124" cy="90" r="3"/><circle cx="134" cy="90" r="3"/>
    </g>
    <!-- traces -->
    <g stroke="#7fe3a8" stroke-width="1.6" fill="none" opacity="0.8">
      <path d="M78 128 H98 L104 134 H128"/>
      <path d="M78 140 H120"/>
      <path d="M142 128 H126 L120 122 H100"/>
    </g>
    <rect x="128" y="132" width="14" height="12" rx="1.5" fill="#12324a"/>

    <!-- raspberry -->
    <g transform="translate(110 118)">
      <!-- leaves -->
      <path d="M0 -20 C-8 -30 -20 -30 -24 -22 C-14 -20 -6 -14 0 -6 Z" fill="#3aa757"/>
      <path d="M0 -20 C8 -30 20 -30 24 -22 C14 -20 6 -14 0 -6 Z" fill="#2e8b48"/>
      <!-- berries -->
      <g fill="#c51a4a">
        <circle cx="0"  cy="-4" r="5.4"/>
        <circle cx="-8" cy="2"  r="5.4"/><circle cx="8" cy="2" r="5.4"/>
        <circle cx="-4" cy="10" r="5.4"/><circle cx="4" cy="10" r="5.4"/>
        <circle cx="0"  cy="4"  r="5.4"/>
      </g>
      <g fill="#e5497a" opacity="0.7">
        <circle cx="-2" cy="-5" r="1.6"/><circle cx="-9" cy="1" r="1.6"/>
        <circle cx="6" cy="1" r="1.6"/><circle cx="2" cy="9" r="1.6"/>
      </g>
    </g>
  </g>

  <!-- ── Wordmark ── -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="210" y="132" font-size="86" letter-spacing="-1">
      <tspan fill="#c51a4a">Gum</tspan><tspan fill="#2b6cb0">CP</tspan>
    </text>
    <text x="214" y="170" font-size="21" font-weight="600" letter-spacing="4.5" fill="#7c8899">
      RASPBERRY PI WEB CONTROL PANEL
    </text>
  </g>
</svg>
